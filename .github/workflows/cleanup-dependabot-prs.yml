name: Cleanup superseded Dependabot PRs (temporary)
# 一次性工具：关闭 headRefName 以 dependabot/github_actions/ 开头的 open PR
# （这些升级已由 chore(ci) 提交直接落入 main，PR 已无内容可合并）。用完即删。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = 只打印将要关闭的 PR"
        required: true
        default: "true"
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close superseded Dependabot actions PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -e
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,title,headRefName \
            --jq '.[] | select(.headRefName | startswith("dependabot/github_actions/")) | "\(.number)|\(.title)"' > /tmp/prs.txt
          echo "matched: $(wc -l < /tmp/prs.txt)"
          cat /tmp/prs.txt
          while IFS='|' read -r num title; do
            [ -z "$num" ] && continue
            if [ "$DRY" = "true" ]; then
              echo "DRY-RUN would close #$num  $title"
            else
              gh pr close "$num" --repo "$GITHUB_REPOSITORY" && echo "closed #$num  $title"
            fi
          done < /tmp/prs.txt
